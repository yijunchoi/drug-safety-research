[project]
name = "drug-safety-research"
version = "0.1.0"
description = "Deep research over FDA data: a lead fans out researchers over openFDA side-effect reports, labels and recalls, then a writer and a fact-checker turn their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
